<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Nav bar</title>
<style>
:root{
--ground:#0a0e17;--panel:#0f1524;--line:#26314d;--line2:#334155;
--ink:#e6edf7;--ink2:#c7d2e8;--muted:#7d8db0;--accent:#43b3a4;--accent-ink:#06201c;
--glass:rgba(12,18,32,.86);--glass-bd:rgba(150,170,210,.16);
--sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
body{background:var(--ground);font-family:var(--sans);padding:0;min-height:160px}
.bg{height:160px;background:
  radial-gradient(900px 300px at 70% -40%, rgba(67,179,164,.10), transparent),
  var(--ground)}
.nav{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:60px;background:var(--glass);backdrop-filter:saturate(1.15) blur(9px);
  border-bottom:1px solid var(--glass-bd)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:16px;letter-spacing:.02em;color:var(--ink)}
.mark{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,var(--accent),#2d8a7e);
  display:grid;place-items:center;color:var(--accent-ink);font-size:11px;font-weight:800}
.lc{color:var(--ink)} .iq{color:var(--accent)}
.links{display:flex;align-items:center;gap:26px;list-style:none}
.links a{color:var(--ink2);font-size:13.5px;text-decoration:none}
.links a:hover{color:var(--ink)}
.cta{font-family:var(--mono);font-size:12px;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);
  padding:8px 14px;border-radius:7px;font-weight:600}
</style></head>
<body><div class="bg">
<nav class="nav">
  <div class="brand"><span class="mark">C</span><span class="lc">Clima</span><span class="iq">IQ</span></div>
  <ul class="links">
    <li><a href="#">Explorer</a></li>
    <li><a href="#">Platform</a></li>
    <li><a href="#">Science</a></li>
    <li><a href="#">Validation</a></li>
    <li><a class="cta" href="#">Open Explorer →</a></li>
  </ul>
</nav>
</div></body></html>
