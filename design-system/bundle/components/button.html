<!doctype html><html lang="en"><head><meta charset="utf-8">
<title>Buttons</title>
<style>
:root{
--ground:#0a0e17;--panel:#0f1524;--line:#26314d;--line2:#334155;
--ink:#e6edf7;--ink2:#c7d2e8;--muted:#7d8db0;--accent:#43b3a4;--accent-ink:#06201c;
--sans:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif;
--mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);padding:28px}
h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:18px}
.glabel{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 10px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font-family:var(--mono);font-size:13px;letter-spacing:.03em;padding:11px 18px;border-radius:8px;
  cursor:pointer;border:1px solid transparent;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.primary:hover{background:#4ec5b4}
.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
.ghost:hover{border-color:var(--accent);color:var(--ink)}
.quiet{background:var(--panel);color:var(--ink2);border-color:var(--line)}
.sm{font-size:11px;padding:7px 12px}
</style></head>
<body>
<h1>Buttons · mono labels</h1>
<div class="glabel">Default</div>
<div class="row">
  <a class="btn primary" href="#">Open the Explorer →</a>
  <a class="btn ghost" href="#">Read the science</a>
  <a class="btn quiet" href="#">Utah coverage</a>
</div>
<div class="glabel">Small</div>
<div class="row">
  <a class="btn primary sm" href="#">Open →</a>
  <a class="btn ghost sm" href="#">Docs</a>
</div>
</body></html>
